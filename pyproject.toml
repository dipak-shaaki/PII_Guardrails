[project]
name = "pii-guardrails"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dipak-shaaki", email = "shanki.dipak@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=48.0.1",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "groq>=1.7.0",
    "langgraph>=1.2.14",
    "phonenumbers>=9.0.41",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "spacy>=3.8.16",
    "uvicorn>=0.54.0",
]

[project.scripts]
pii-guardrails = "pii_guardrails:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
