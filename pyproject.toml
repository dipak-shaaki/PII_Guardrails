[project]
name = "pii-guardrails"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dipak-shaaki", email = "shanki.dipak@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-generativeai>=0.8.6",
    "groq>=1.7.0",
    "phonenumbers>=9.0.41",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "redis>=8.1.0",
    "spacy>=3.8.16",
]

[project.scripts]
pii-guardrails = "pii_guardrails:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
